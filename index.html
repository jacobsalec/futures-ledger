<script>

function rollAll(){

    if(!change){e.textContent=nv;return}

    for(const ch of nv){

        if(!ghosts){ghosts=true;if(!first)for(let g=0;g<extra;g++)html+=wh(10+(change?od[g]:0),{an:change,i:g,d:0,gh:change})}
        const d=+ch,o=od[di-off]??0;
        html+=wh(10+(change?o:d),{an:change,i:(first?0:extra)+di,d,nw:change&&!first&&di<off});di++}

      });
    setTimeout(()=>{e.textContent=nv},(.55+.05*(A.length+3))*1000+150);
    e.querySelectorAll('[data-gh],[data-nw]').forEach(dg=>{const gh=dg.dataset.gh;dg.style.transition='max-width .45s ease,opacity .45s ease';dg.style.maxWidth=gh?'0':'1ch';dg.style.opacity=gh?'0':'1'});
  });
}

document.addEventListener('change',e=>{if(e.target.id=='pdf-year')pdfYear=e.target.value;if(e.target.dataset&&e.target.dataset.prefc){const y=getSc();render();setSc(y)}if(e.target.id=='tx-pct')render();if(e.target.id=='w-date')doFx()});
$('#file').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)scan(f)});
$('#imgin').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)addImgs(f)});
$('#avin').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{S.prefs=S.prefs||{};S.prefs.avatar=await avatarFrom(f);save();render()}catch(x){toast('Could not use that photo.')}});
$('#csvin').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  const T={days:0,exp:0,pay:0,dup:0,bad:0};let unk=0;
  for(const f of fs){let r=null;try{r=importCSV(await f.text())}catch(x){}if(!r){unk++;continue}for(const k in T)T[k]+=r[k]}
  save();render();
  const a=[];if(T.days)a.push(T.days+' day'+(T.days==1?'':'s'));if(T.exp)a.push(T.exp+' expense'+(T.exp==1?'':'s'));if(T.pay)a.push(T.pay+' payout'+(T.pay==1?'':'s'));
  toast((a.length?'Imported '+a.join(', ')+'.':'Nothing new to import.')+(T.dup?' Skipped '+T.dup+' already here.':'')+(T.bad?' '+T.bad+' row'+(T.bad==1?'':'s')+' had no valid date.':'')+(unk?' '+unk+' file'+(unk==1?'':'s')+" didn't look like a CSV exported from this app.":''))});
$('#bk').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.entries))throw 0;if(confirm('Replace everything in the app with this backup ('+o.entries.length+' days)?')){S=Object.assign({entries:[],expenses:[],recon:{},rate:1.22,withdrawals:[],taxPct:25,fx:null,deductFees:true,mode:'pa',prefs:{},dev:{}},o);save();render()}}catch(x){alert('That file is not a valid backup.')}};r.readAsText(f)});
$('#sheet').addEventListener('click',e=>{if(e.target.id=='sheet')closeSheet()});
{const sm=(S.prefs||{}).startMode;if(sm==='pa'||sm==='eval')S.mode=sm}
applyPrefs();
render();
initSync();
initSwipe();
initViewer();
</script>
</body>
</html>
