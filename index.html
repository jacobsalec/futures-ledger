<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Futures Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futures Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f5f4ee;--card:#fff;--line:#e3e1d8;--tx:#1f1e1d;--mut:#76736b;--acc:#c6613f;--blu:#5a7ea6;--up:#2f7d4f;--dn:#c0432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2b2a28;--line:#3b3a37;--tx:#faf9f5;--mut:#9c9a92;--acc:#d97757;--up:#7fc08f;--dn:#e8806c}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2b2a28;--line:#3b3a37;--tx:#faf9f5;--mut:#9c9a92;--acc:#d97757;--up:#7fc08f;--dn:#e8806c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;padding:16px 16px 96px}
h1{font-size:26px;margin:8px 0 2px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.big{font-size:38px;font-weight:650;letter-spacing:-.03em}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}.mid{font-size:22px;font-weight:600;margin-top:4px}
.up{color:var(--up)}.org{color:#c98b4a}.dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.item{padding:14px 0;border-top:1px solid var(--line);cursor:pointer}.item:first-child{border-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:130px;background:none;border:0;color:var(--mut);padding:10px 2px;border-radius:12px;font:inherit;font-size:13px}
.nav button.on{color:var(--tx);background:var(--card)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:600;width:100%}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.blue{background:var(--blu)}
.btn.red{background:#b0594e}
.stack{display:grid;gap:10px;margin-bottom:12px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.pane{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.tr{display:grid;grid-template-columns:1fr 64px auto 28px;gap:6px;margin-bottom:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--bg);color:var(--mut);border:0;padding:10px 11px;font:inherit;font-size:14px}
.seg .on.l{background:var(--blu);color:#fff}.seg .on.s{background:#77746d;color:#fff}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;margin:0 6px 6px 0}
.chip.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.msg{font-size:14px;color:var(--mut);margin:8px 0}.err{color:var(--dn)}
.empty{text-align:center;color:var(--mut);padding:36px 8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.cd small{font-size:9px;color:var(--mut)}
.cd.up{background:rgba(70,160,100,.3)}.cd.dn{background:rgba(210,90,70,.3)}.cd.td{outline:1.5px solid var(--blu)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fo{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.eqline{stroke-dasharray:1;animation:dr 1s ease-out}.eqarea{animation:fo .9s ease-out}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.on{opacity:1}
.fade{animation:fi .22s ease-out}
.sheet.open{animation:fo .2s ease-out}
.sheet.open .pane{animation:su .28s cubic-bezier(.2,.8,.2,1)}
.stag>*{animation:fi .3s ease-out both;animation-delay:.24s}
.stag>:nth-child(1){animation-delay:0s}.stag>:nth-child(2){animation-delay:.03s}.stag>:nth-child(3){animation-delay:.06s}.stag>:nth-child(4){animation-delay:.09s}.stag>:nth-child(5){animation-delay:.12s}.stag>:nth-child(6){animation-delay:.15s}.stag>:nth-child(7){animation-delay:.18s}.stag>:nth-child(8){animation-delay:.21s}
.stag .item{animation:fi .3s ease-out both;animation-delay:.12s}.stag .item:nth-child(2){animation-delay:.2s}.stag .item:nth-child(3){animation-delay:.28s}.stag .item:nth-child(4){animation-delay:.36s}.stag .item:nth-child(5){animation-delay:.44s}.stag .item:nth-child(n+6){animation-delay:.5s}
.editbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px}
.btn{transition:transform .12s,opacity .12s}.btn:active{transform:scale(.98)}
.nav button,.chip,.seg button{transition:background .15s,color .15s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav" id="nav"></div>
<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="bk" accept="application/json,.json" hidden>
<input type="file" id="csvin" accept=".csv,text/csv" multiple hidden>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const TAGS=['Followed plan','Overtraded','Revenge trade','FOMO','Early exit'],CATS=['Platform','Data feed','Prop firm fee','Education','Other'];
let S={entries:[],expenses:[],recon:{},rate:1.22,withdrawals:[],taxPct:25,fx:null,deductFees:true},wd=null,tab='home',draft=null,xd=null,cal=new Date(),status='',rmon=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('futuresLedger')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('futuresLedger',JSON.stringify(S))}catch(e){}};
const n=v=>{v=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(v)?0:v};
const money=(v,sign)=>{const a=Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return (v<0?'−':sign&&v>0?'+':'')+'$'+a};
const cls=v=>v<0?'dn':v>0?'up':'';
const pad=v=>String(v).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,k)=>a.reduce((t,e)=>t+n(e[k]),0);
const fd=(d,o)=>new Date(d+'T12:00').toLocaleDateString(undefined,o);
rmon=today().slice(0,7);

function fadeApp(){const a=$('#app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}
function render(){
  const E=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date)),t=today(),ym=t.slice(0,7),y=t.slice(0,4);
  const net=p=>sum(E.filter(e=>e.date.startsWith(p)),'net');
  $('#nav').innerHTML=[['home','Today'],['log','Journal'],['stats','Stats'],['pay','Payouts'],['tax','Tax']].map(([k,l])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');
  let h='';
  if(tab=='home'){const tn=sum(E.filter(e=>e.date==t),'net');
    h=`<h1>Futures Ledger</h1><div class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="card"><div class="lbl">Today, net</div><div class="big ${cls(tn)}">${money(tn,1)}</div></div>
    <div class="grid"><div class="card"><div class="lbl">This month</div><div class="mid ${cls(net(ym))}">${money(net(ym),1)}</div></div>
    <div class="card"><div class="lbl">This year</div><div class="mid ${cls(net(y))}">${money(net(y),1)}</div></div></div>
    <div style="height:14px"></div><div class="stack"><button class="btn blue" data-act="scan">Add day from screenshot</button><button class="btn alt" data-act="manual">Enter manually</button><button class="btn alt" data-act="exp">Add expense</button></div>
    ${E.length?`<div class="lbl" style="margin:18px 0 6px">Recent</div><div class="card">${E.slice(0,4).map(row).join('')}</div>`:''}`;
  }else if(tab=='log'){h=`<h1>Journal</h1><div class="sub">${E.length} logged day${E.length==1?'':'s'}. Tap a date to add or edit.</div>`+calHTML(E)+(()=>{const p=cal.getFullYear()+'-'+pad(cal.getMonth()+1),M=E.filter(e=>e.date.startsWith(p)).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="lbl" style="margin:14px 0 6px">${cal.toLocaleDateString(undefined,{month:'long',year:'numeric'})} logs, in date order</div>`+(M.length?`<div class="card">${M.map(row).join('')}</div>`:'<div class="empty">No days logged this month.</div>')})();
  }else if(tab=='stats'){h=`<h1>Stats</h1><div class="sub">Across all logged days</div>`+statsHTML(E)+reconHTML();
  }else if(tab=='pay')h=payHTML();
  else h=taxHTML(E,y);
  $('#app').innerHTML=h;if(tab=='tax'||tab=='stats')rcalc();if(tab=='pay')refreshFx();
}
function row(e){return `<div class="item row" data-edit="${e.id}"><div><b>${fd(e.date,{weekday:'short',month:'short',day:'numeric'})}</b><div class="sub" style="margin:0">${n(e.micros)} micro${n(e.micros)==1?'':'s'} · fees ${money(n(e.fees))}${(e.tags||[]).length?' · '+esc(e.tags.join(', ')):''}</div></div><b class="${cls(n(e.net))}">${money(n(e.net),1)}</b></div>`}

function calHTML(E){
  const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),p=y+'-'+pad(m+1),by={};
  E.forEach(e=>{if(e.date.startsWith(p))by[e.date]=(by[e.date]||0)+n(e.net)});
  let c='';for(let i=0;i<first;i++)c+='<div></div>';
  for(let d=1;d<=dim;d++){const k=p+'-'+pad(d),v=by[k];c+=`<div class="cd ${v===undefined?'':v>0?'up':v<0?'dn':''}${k==today()?' td':''}" data-day="${k}">${d}${v===undefined?'':`<small>${Math.round(v)}</small>`}</div>`}
  const mt=Object.values(by).reduce((a,b)=>a+b,0);
  return `<div class="card"><div class="row"><button class="x" data-cal="-1">‹</button><b>${cal.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="x" data-cal="1">›</button></div><div class="row" style="margin:4px 0 10px"><span class="lbl">Month net</span><b class="${cls(mt)}">${money(mt,1)}</b></div><div class="cg">${'SMTWTFS'.split('').map(x=>`<div class="lbl" style="text-align:center">${x}</div>`).join('')}${c}</div></div>`;
}
function chartHTML(A){
  const vals=[0],dts=[A[0].date];let c=0;A.forEach(e=>{c+=n(e.net);vals.push(c);dts.push(e.date)});
  const W=340,H=190,L=46,R=12,T=12,B=26,pw=W-L-R,ph=H-T-B,mn=Math.min(...vals),mx=Math.max(...vals);
  const raw=((mx-mn)||100)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;
  const lo=Math.floor(mn/step)*step,hi=Math.max(Math.ceil(mx/step)*step,lo+step);
  const X=i=>L+(vals.length>1?i*pw/(vals.length-1):0),Y=v=>T+ph-((v-lo)/(hi-lo))*ph;
  const tick=v=>{const a=Math.abs(v);return (v<0?'−':'')+'$'+(a>=1000?(a/1000).toFixed(a%1000?1:0)+'k':a)};
  let grid='';const k=Math.round((hi-lo)/step);
  for(let i=0;i<=k;i++){const v=lo+i*step,y=Y(v).toFixed(1);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" ${Math.abs(v)<1e-9?'':'stroke-dasharray="2 4"'}/><text x="${L-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mut)">${tick(v)}</text>`}
  const P=vals.map((v,i)=>[X(i),Y(v)]);let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,t=.17;
    d+=`C${(p1[0]+(p2[0]-p0[0])*t).toFixed(1)},${(p1[1]+(p2[1]-p0[1])*t).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t).toFixed(1)},${(p2[1]-(p3[1]-p1[1])*t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  const bot=T+ph,last=P[P.length-1],area=d+`L${last[0].toFixed(1)},${bot}L${P[0][0].toFixed(1)},${bot}Z`;
  const cnt=Math.min(4,vals.length);let xl='';
  for(let j=0;j<cnt;j++){const i=Math.round(j*(vals.length-1)/((cnt-1)||1));xl+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${j==0?'start':j==cnt-1?'end':'middle'}" font-size="10" fill="var(--mut)">${fd(dts[i],{month:'short',day:'numeric'})}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px"><defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f94bf" stop-opacity=".55"/><stop offset="1" stop-color="#6f94bf" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#eqg)" class="eqarea"/><path d="${d}" pathLength="1" fill="none" stroke="#7aa0cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="eqline"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="7" fill="#7aa0cc" opacity=".25"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="#7aa0cc" stroke="var(--card)" stroke-width="1.5"/>${xl}</svg><div class="row" style="margin-top:6px"><span class="lbl">Total</span><b class="${cls(c)}">${money(c,1)}</b></div>`;
}
let wkStart=null;
const ymd=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
function monOf(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function barHTML(E){
  if(!wkStart)wkStart=monOf(new Date());
  const days=[...Array(7)].map((_,i)=>{const d=new Date(wkStart);d.setDate(d.getDate()+i);return d});
  const vals=days.map(d=>{const L=E.filter(e=>e.date==ymd(d));return L.length?sum(L,'net'):null});
  const real=vals.filter(v=>v!==null),tot=real.reduce((a,b)=>a+b,0);
  const W=340,H=220,L0=46,R=8,T=20,B=36,pw=W-L0-R,ph=H-T-B,mn=Math.min(0,...real),mx=Math.max(0,...real);
  const raw=((mx-mn)||100)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;
  const lo=Math.floor(mn/step)*step,hi=Math.max(Math.ceil(mx/step)*step,lo+step),Y=v=>T+ph-((v-lo)/(hi-lo))*ph,zy=Y(0),bw=pw/7;
  const tick=v=>{const a=Math.abs(v);return (v<0?'−':'')+'$'+(a>=1000?(a/1000).toFixed(a%1000?1:0)+'k':a)},fmt=v=>(v>0?'+':v<0?'−':'')+'$'+Math.abs(Math.round(v));
  let g='';const k=Math.round((hi-lo)/step);
  for(let i=0;i<=k;i++){const v=lo+i*step,y=Y(v).toFixed(1);g+=`<line x1="${L0}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" ${Math.abs(v)<1e-9?'':'stroke-dasharray="2 4"'}/><text x="${L0-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mut)">${tick(v)}</text>`}
  days.forEach((d,i)=>{const v=vals[i],x=L0+i*bw+bw*.18,w=bw*.64,cx=x+w/2;
    if(v){const up=v>0,h=Math.max(2,Math.abs(Y(v)-zy)),y=up?zy-h:zy;
      g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" style="fill:var(${up?'--up':'--dn'});transform-box:fill-box;transform-origin:50% ${up?'100%':'0%'};animation:grow .5s ease-out both;animation-delay:${i*.04}s"/><text x="${cx.toFixed(1)}" y="${(up?y-4:y+h+11).toFixed(1)}" text-anchor="middle" font-size="9.5" style="fill:var(${up?'--up':'--dn'})">${fmt(v)}</text>`}
    else if(v===0)g+=`<rect x="${x.toFixed(1)}" y="${(zy-1).toFixed(1)}" width="${w.toFixed(1)}" height="2" rx="1" fill="var(--mut)"/>`;
    g+=`<text x="${cx.toFixed(1)}" y="${H-19}" text-anchor="middle" font-size="10" fill="var(--mut)">${d.toLocaleDateString(undefined,{weekday:'short'})}</text><text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--mut)" opacity=".7">${d.getDate()}</text>`});
  const end=new Date(wkStart);end.setDate(end.getDate()+6);const cur=ymd(wkStart)==ymd(monOf(new Date())),o={month:'short',day:'numeric'};
  return `<div class="card"><div class="row"><button class="x" data-wk="-1">‹</button><b>${wkStart.toLocaleDateString(undefined,o)} – ${end.toLocaleDateString(undefined,o)}</b><button class="x" data-wk="1" ${cur?'disabled style="opacity:.25"':''}>›</button></div>
  <div class="row" style="margin:2px 0 4px"><span class="lbl">Week net · ${real.length} day${real.length==1?'':'s'} logged</span><b class="${cls(tot)}">${money(tot,1)}</b></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
}
function statsHTML(E){
  if(!E.length)return '<div class="empty">Log a few days to see your stats.</div>';
  const G={};E.forEach(e=>{const x=G[e.date]||(G[e.date]={date:e.date,net:0,tags:[]});x.net+=n(e.net);(e.tags||[]).forEach(t=>{if(!x.tags.includes(t))x.tags.push(t)})});const A=Object.values(G).sort((a,b)=>a.date.localeCompare(b.date)),nets=A.map(e=>n(e.net)),W=nets.filter(v=>v>0),L=nets.filter(v=>v<0);
  const sw=W.reduce((a,b)=>a+b,0),sl=Math.abs(L.reduce((a,b)=>a+b,0)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  let c=0,pk=0,dd=0;const pts=nets.map(v=>c+=v);pts.forEach(v=>{pk=Math.max(pk,v);dd=Math.max(dd,pk-v)});
  const mn=Math.min(0,...pts),mx=Math.max(0,...pts),rg=(mx-mn)||1,w=300,hh=110,st=pts.length>1?w/(pts.length-1):0;
  const line=pts.map((v,i)=>(i*st).toFixed(1)+','+(hh-((v-mn)/rg)*hh).toFixed(1)).join(' '),zy=(hh-((0-mn)/rg)*hh).toFixed(1);
  const rows=[['Win rate',Math.round(W.length/nets.length*100)+'%'],['Average win',money(avg(W)),'up'],['Average loss',money(avg(L)),'dn'],['Profit factor',sl?(sw/sl).toFixed(2):(sw?'∞':'0')],['Max drawdown',money(-dd),'dn'],['Best day',money(Math.max(...nets),1),'up'],['Worst day',money(Math.min(...nets),1),'dn']];
  const tg=TAGS.map(t=>{const X=A.filter(e=>(e.tags||[]).includes(t));return X.length?[t,X.length,sum(X,'net')/X.length]:null}).filter(Boolean);

    const j=await res.json();if(!res.ok){if(res.status==401)localStorage.removeItem('futuresLedgerKey');throw {message:(j.error&&j.error.message)||'Request failed.'}}
    const r=JSON.parse(j.content.map(c=>c.text||'').join('').match(/\{[\s\S]*\}/)[0]),T=r.trades||[];
    if(!T.length)throw {message:'No trades found in that screenshot.'};
    const gross=+T.reduce((t,x)=>t+n(x.pnl),0).toFixed(2),q=T.reduce((t,x)=>t+n(x.qty),0),shown=+T.reduce((t,x)=>t+Math.abs(n(x.commissions))+Math.abs(n(x.fees)),0).toFixed(2),mine=+(q*S.rate).toFixed(2);
    draft=newDraft({date:r.date||today(),basis:'gross',net:gross,trades:T.map(t=>({symbol:t.symbol||'',side:/short|sell/i.test(t.side||'')?'Short':'Long',qty:t.qty??'',pnl:t.pnl??'',entry:t.entry??'',exit:t.exit??'',entryTime:t.entryTime||'',exitTime:t.exitTime||''}))});
    status='Read '+T.length+' trade'+(T.length==1?'':'s')+'. The P&L column is before fees, so it is entered as Gross.'+(shown?(Math.abs(shown-mine)<.05?' Fees match your screenshot ('+money(shown)+').':' Your screenshot shows '+money(shown)+' in commissions and fees, but your rate gives '+money(mine)+'. Check the fee per micro.'):'')+' Check the numbers before saving.';
  }catch(e){status='!'+(e.message||'Could not read the screenshot.')+' You can still enter the day manually.'}
  paint(1);
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),5000)}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}if(c!==''||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>v!==''))}
function normDate(v){v=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(v);return isNaN(d)?null:ymd(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function importCSV(text){
  const R=parseCSV(text);if(R.length<2)return null;const H=R[0].map(h=>h.trim()),res={days:0,exp:0,pay:0,dup:0,bad:0},g=(row,k)=>{const i=H.indexOf(k);return i<0?'':String(row[i]??'')},body=R.slice(1);
  if(H.includes('Symbol')&&H.includes('Day net')){
    const sig=e=>[e.date,n(e.net),n(e.micros),n(e.fees),e.notes||'',(e.trades||[]).map(t=>[t.symbol||'',t.side||'',n(t.qty)].join(':')).join(',')].join('|'),seen=new Set(S.entries.map(sig)),out=[];let cur=null;
    body.forEach(row=>{const d=normDate(g(row,'Date'));if(!d){res.bad++;return}
      if(g(row,'Day net')!==''){cur={id:uid(),date:d,trades:[],gross:n(g(row,'Day gross')),micros:n(g(row,'Micros')),fees:n(g(row,'Day fees')),net:n(g(row,'Day net')),tags:g(row,'Tags').split(';').map(x=>x.trim()).filter(Boolean),notes:g(row,'Notes')};out.push(cur)}
      if(!cur)return;const sym=g(row,'Symbol'),qty=g(row,'Trade micros'),pl=g(row,'Trade P&L');
      if(sym||qty!=='')cur.trades.push({symbol:sym,side:g(row,'Side')||'Long',qty:qty===''?'':n(qty),entry:g(row,'Entry'),exit:g(row,'Exit'),pnl:pl===''?'':n(pl),entryTime:g(row,'Entry time'),exitTime:g(row,'Exit time')})});
    out.forEach(e=>{e.ntr=e.trades.length||1;const k=sig(e);if(seen.has(k))res.dup++;else{seen.add(k);S.entries.push(e);res.days++}});
  }else if(H.includes('Category')){
    const seen=new Set(S.expenses.map(x=>[x.date,n(x.amount),x.cat,x.note||''].join('|')));
    body.forEach(row=>{const d=normDate(g(row,'Date'));if(!d){res.bad++;return}const x={id:uid(),date:d,amount:Math.abs(n(g(row,'Amount'))),cat:g(row,'Category')||'Other',note:g(row,'Note')},k=[x.date,x.amount,x.cat,x.note].join('|');if(seen.has(k))res.dup++;else{seen.add(k);S.expenses.push(x);res.exp++}});
  }else if(H.includes('USD amount')){
    const seen=new Set(S.withdrawals.map(x=>[x.date,n(x.usd),n(x.fx),x.note||''].join('|')));
    body.forEach(row=>{const d=normDate(g(row,'Date'));if(!d){res.bad++;return}const x={id:uid(),date:d,usd:n(g(row,'USD amount')),fx:n(g(row,'USD to CAD rate')),cad:n(g(row,'CAD amount')),pct:n(g(row,'Set-aside %')),setUsd:n(g(row,'Set aside USD')),setCad:n(g(row,'Set aside CAD')),note:g(row,'Note')},k=[x.date,x.usd,x.fx,x.note].join('|');if(seen.has(k))res.dup++;else{seen.add(k);S.withdrawals.push(x);res.pay++}});
  }else return null;
  return res;
}
function dlf(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csv(){
  const rows=[['Date','Symbol','Side','Trade micros','Entry','Exit','Trade P&L','Entry time','Exit time','Day gross','Micros','Day fees','Day net','Tags','Notes']];
  [...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const T=e.trades&&e.trades.length?e.trades:[{}];
    T.forEach((t,i)=>rows.push([e.date,t.symbol||'',t.side||'',t.qty??'',t.entry??'',t.exit??'',t.pnl??'',t.entryTime||'',t.exitTime||'',i?'':e.gross,i?'':e.micros,i?'':e.fees,i?'':e.net,i?'':(e.tags||[]).join('; '),i?'':(e.notes||'')]))});
  dlf('futures-ledger-trades.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function xcsv(){const rows=[['Date','Category','Amount','Note']];[...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push([x.date,x.cat,x.amount,x.note||'']));dlf('futures-ledger-expenses.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-tab],[data-act],[data-edit],[data-del],[data-side],[data-tag],[data-cat],[data-day],[data-cal],[data-xedit],[data-wedit],[data-basis],[data-wk]');if(!g)return;

  if(D.cal){cal=new Date(cal.getFullYear(),cal.getMonth()+ +D.cal,1);render();fadeApp();return}

  if(D.edit){draft=JSON.parse(JSON.stringify(S.entries.find(v=>v.id==D.edit)));status='';openSheet();view();return}
  if(D.wedit){wd=JSON.parse(JSON.stringify(S.withdrawals.find(v=>v.id==D.wedit)));openSheet();paintW();stag();return}
  if(D.xedit){xd=JSON.parse(JSON.stringify(S.expenses.find(v=>v.id==D.xedit)));openSheet();paintX();stag();return}
  if(D.basis){draft.basis=D.basis;[...g.parentNode.children].forEach(b=>b.className=b===g?'on l':'');$('#l-amt').textContent=D.basis=='gross'?'Gross P&L (before commissions)':'Net P&L (as shown on your platform, after commissions)';calc();return}
  if(D.wk){if(g.disabled)return;wkStart.setDate(wkStart.getDate()+7*+D.wk);render();return}
  if(D.side){const [i,v]=D.side.split(':');draft.trades[+i].side=v;const b=g.parentNode.children;b[0].className=v=='Long'?'on l':'';b[1].className=v=='Short'?'on s':'';return}
  if(D.tag){const i=draft.tags.indexOf(D.tag);if(i>=0)draft.tags.splice(i,1);else draft.tags.push(D.tag);g.classList.toggle('on');return}
  if(D.cat){xd.cat=D.cat;[...g.parentNode.children].forEach(c=>c.classList.toggle('on',c===g));return}
  if(D.del!==undefined){pull();draft.trades.splice(+D.del,1);if(!draft.trades.length)draft.micros='';paint();return}
  const a=D.act;
  if(a=='scan')$('#file').click();
  else if(a=='manual'){draft=newDraft();status='';openSheet();paint(1)}
  else if(a=='exp'){xd={id:null,date:today(),amount:'',cat:'Platform',note:''};openSheet();paintX();stag()}
  else if(a=='editday'){status='';paint(1)}
  else if(a=='addsame'){draft=newDraft({date:D.date});status='';paint(1)}
  else if(a=='wadd'){wd={id:null,date:today(),usd:'',fx:S.fx||'',note:''};openSheet();paintW();stag();doFx()}
  else if(a=='getfx')doFx();
  else if(a=='wcsv'){const rows=[['Date','USD amount','USD to CAD rate','CAD amount','Set-aside %','Set aside USD','Set aside CAD','Note']];[...S.withdrawals].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>rows.push([w.date,w.usd,w.fx,w.cad,w.pct,w.setUsd,w.setCad,w.note||'']));dlf('futures-ledger-payouts.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
  else if(a=='wdelete'){if(!wd._c){wd._c=1;g.textContent='Tap again to confirm delete';g.style.color='var(--dn)'}else{S.withdrawals=S.withdrawals.filter(v=>v.id!=wd.id);save();closeSheet();render()}}
  else if(a=='wsave'){wd.date=$('#w-date').value||today();wd.note=$('#w-note').value;const u=Math.abs(n($('#w-amt').value)),f=n($('#w-fx').value);
    if(!u||!f){$('#w-msg').className='msg err';$('#w-msg').textContent='Enter the amount and an exchange rate first.';return}
    const cad=+(u*f).toFixed(2);delete wd._c;Object.assign(wd,{usd:u,fx:f,cad,pct:S.taxPct,setUsd:+(u*S.taxPct/100).toFixed(2),setCad:+(cad*S.taxPct/100).toFixed(2)});S.fx=f;
    if(wd.id)S.withdrawals=S.withdrawals.map(v=>v.id==wd.id?wd:v);else{wd.id=Date.now().toString(36);S.withdrawals.push(wd)}save();closeSheet();render()}
  else if(a=='tgfees'){S.deductFees=(S.deductFees===false);save();render()}
  else if(a=='csvimp')$('#csvin').click();
  else if(a=='close'||a=='done')closeSheet();
  else if(a=='addtrade'){pull();draft.trades.push({symbol:'',side:'Long',qty:'',pnl:''});paint()}
  else if(a=='csv')csv();else if(a=='xcsv')xcsv();
  else if(a=='backup')dlf('futures-ledger-backup-'+today()+'.json',JSON.stringify(S),'application/json');
  else if(a=='restore')$('#bk').click();
  else if(a=='key'){const k=(prompt('Paste your Anthropic API key (stored only on this device):')||'').trim();if(k)localStorage.setItem('futuresLedgerKey',k)}
  else if(a=='delete'){if(!draft._c){draft._c=1;g.textContent='Tap again to confirm delete';g.style.color='var(--dn)'}else{S.entries=S.entries.filter(v=>v.id!=draft.id);save();closeSheet();render()}}

  else if(a=='xsave'){xd.date=$('#x-date').value||today();xd.amount=Math.abs(n($('#x-amt').value));xd.note=$('#x-note').value;delete xd._c;
    if(xd.id)S.expenses=S.expenses.map(v=>v.id==xd.id?xd:v);else{xd.id=Date.now().toString(36);S.expenses.push(xd)}save();closeSheet();render()}
  else if(a=='save'){pull();const kept=draft.trades.filter(t=>t.symbol||n(t.qty)),mc=+kept.reduce((t,x)=>t+n(x.qty),0).toFixed(4),amt=n(draft.net),fe=+(mc*S.rate).toFixed(2),gb=draft.basis=='gross',nt=gb?+(amt-fe).toFixed(2):amt,gr=gb?amt:+(amt+fe).toFixed(2);

    if(o.id)S.entries=S.entries.map(v=>v.id==o.id?o:v);else{o.id=Date.now().toString(36);S.entries.push(o)}

});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.t!==undefined){draft.trades[+el.dataset.t][el.dataset.k]=el.value;if(el.dataset.k=='qty')calc();return}
  if(['f-net','f-micros','f-ntr','f-rate'].includes(el.id))calc();
  if(['w-amt','w-fx'].includes(el.id))wcalc();
  if(el.id=='tx-pct'){S.taxPct=n(el.value);save()}
  if(el.id=='rc-m'){rmon=el.value||rmon;$('#rc-v').value=S.recon[rmon]??'';rcalc()}
  if(el.id=='rc-v'){S.recon[rmon]=el.value;save();rcalc()}
});
document.addEventListener('change',e=>{if(e.target.id=='tx-pct')render();if(e.target.id=='w-date')doFx()});
$('#file').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)scan(f)});
$('#csvin').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  const T={days:0,exp:0,pay:0,dup:0,bad:0};let unk=0;
  for(const f of fs){let r=null;try{r=importCSV(await f.text())}catch(x){}if(!r){unk++;continue}for(const k in T)T[k]+=r[k]}
  save();render();
  const a=[];if(T.days)a.push(T.days+' day'+(T.days==1?'':'s'));if(T.exp)a.push(T.exp+' expense'+(T.exp==1?'':'s'));if(T.pay)a.push(T.pay+' payout'+(T.pay==1?'':'s'));
  toast((a.length?'Imported '+a.join(', ')+'.':'Nothing new to import.')+(T.dup?' Skipped '+T.dup+' already here.':'')+(T.bad?' '+T.bad+' row'+(T.bad==1?'':'s')+' had no valid date.':'')+(unk?' '+unk+' file'+(unk==1?'':'s')+" didn't look like a CSV exported from this app.":''))});
$('#bk').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.entries))throw 0;if(confirm('Replace everything in the app with this backup ('+o.entries.length+' days)?')){S=Object.assign({entries:[],expenses:[],recon:{},rate:1.22,withdrawals:[],taxPct:25,fx:null,deductFees:true},o);save();render()}}catch(x){alert('That file is not a valid backup.')}};r.readAsText(f)});
